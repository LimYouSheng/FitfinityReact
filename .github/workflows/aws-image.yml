name: AWS - Build Scan And Publish Image
run-name: ${{ inputs.orchestration_id && format('Release operation {0}', inputs.orchestration_id) || github.event.head_commit.message || github.workflow }}

on:
  workflow_dispatch:
    inputs:
      orchestration_id:
        description: Optional correlation ID supplied by the release orchestrator
        required: false
        type: string
      target:
        description: Deployment target name in repository configuration
        required: true
        type: string
        default: developer
      verification_run:
        description: Successful exact-source main verification run ID
        required: true
        type: string
      source_sha:
        description: Exact main commit to verify and publish (40-character SHA)
        required: true
        type: string

env:
  FITFINITY_DEPLOYMENT_TARGETS_JSON: ${{ vars.FITFINITY_DEPLOYMENT_TARGETS_JSON }}
permissions:
  contents: read

jobs:
  source:
    if: github.ref == 'refs/heads/main' && vars.AWS_IMAGE_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      profile: ${{ steps.target.outputs.profile }}
      environment: ${{ steps.target.outputs.environment }}
      account: ${{ steps.target.outputs.account }}
      region: ${{ steps.target.outputs.region }}
      image_role: ${{ steps.target.outputs.image_role }}
    steps:
      - name: Require the explicitly selected main commit
        env:
          EXPECTED_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: target
        env:
          DEPLOYMENT_TARGET: ${{ inputs.target }}
        run: python3 backend/infrastructure/deployment_profile.py

  verify:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Authenticate existing exact-source CI evidence
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_PROFILE: ${{ needs.source.outputs.profile }}
          VERIFICATION_RUN: ${{ inputs.verification_run }}
        run: python3 backend/infrastructure/release_verification.py --profile "$DEPLOYMENT_PROFILE" --purpose image
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fitfinity-image-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image-verification.json
          if-no-files-found: error
          retention-days: 14

  image:
    needs: [verify, source]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.AWS_IMAGE_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: ${{ needs.source.outputs.environment }}
    concurrency:
      group: fitfinity-${{ needs.source.outputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      checks: read
      id-token: write
    steps:
      - name: Explain Workflow Purpose And Expected Results
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'FITFINITY_WORKFLOW_GUIDE'
          ## AWS - Build Scan And Publish Image

          **What It Does:** Manual; authenticates existing exact-source CI, builds/scans and publishes image candidate.

          **When To Use It:** A new approved image; publication alone does not switch Lambda.

          **What To Expect:** Expect a scanned image digest and source-bound publication receipt. This writes to ECR but does not switch the serving Lambda version.

          This is a workflow guide, not a success receipt. Check job results and retained artifacts.

          AWS execution remains subject to the existing main/source checks, enablement flags where configured and environment approval. A skipped or approval-waiting job has not completed the operation.

          Full procedure: `docs/runbook.md`, section 6.
          FITFINITY_WORKFLOW_GUIDE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Recheck source evidence after environment approval
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_PROFILE: ${{ needs.source.outputs.profile }}
          VERIFICATION_RUN: ${{ inputs.verification_run }}
        run: python3 backend/infrastructure/release_verification.py --profile "$DEPLOYMENT_PROFILE" --purpose image
      - name: Require the exact image publication role
        env:
          IMAGE_ROLE: ${{ vars.AWS_IMAGE_ROLE_ARN }}
          EXPECTED_ROLE: ${{ needs.source.outputs.image_role }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$IMAGE_ROLE" = "$EXPECTED_ROLE"
      - name: Obtain temporary image publication credentials
        id: aws_credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ vars.AWS_IMAGE_ROLE_ARN }}
          role-session-name: fitfinity-image-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: ${{ needs.source.outputs.region }}
          unset-current-credentials: true
      - name: Verify authenticated AWS account
        env:
          ACTUAL_ACCOUNT: ${{ steps.aws_credentials.outputs.aws-account-id }}
          EXPECTED_ACCOUNT: ${{ needs.source.outputs.account }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPECTED_ACCOUNT"
          test "$ACTUAL_ACCOUNT" = "$EXPECTED_ACCOUNT"
      - name: Build, publish and scan the verified image
        env:
          DEPLOYMENT_PROFILE: ${{ needs.source.outputs.profile }}
        shell: bash
        run: |
          set -euo pipefail
          python3 backend/infrastructure/deploy.py image-candidate --actions --profile "$DEPLOYMENT_PROFILE" --receipt "$RUNNER_TEMP/fitfinity-image-candidate.json" 2>&1 | tee "$RUNNER_TEMP/fitfinity-image-candidate.log"
      - name: Retain candidate evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fitfinity-image-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/image-verification.json
            ${{ runner.temp }}/fitfinity-image-candidate.json
            ${{ runner.temp }}/fitfinity-image-candidate.log
          if-no-files-found: error
