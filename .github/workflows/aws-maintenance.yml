name: AWS - Release Maintenance
on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target name in repository configuration
        type: string
        default: developer
        required: true
      mode:
        type: choice
        options: [pause, inspect, record-pause-create, record-pause-inspect, record-pause-execute, record-pause-verify, snapshot, snapshot-check]
        required: true
      review_run:
        description: Successful manual release-preparation run containing the reviewed maintenance package
        type: string
        required: true
      review_sha256:
        description: Exact SHA256 of the reviewed maintenance metadata
        type: string
        required: true
      prior_run:
        description: Original maintenance run for inspection or the next step
        type: string
        required: false
env:
  FITFINITY_DEPLOYMENT_TARGETS_JSON: ${{ vars.FITFINITY_DEPLOYMENT_TARGETS_JSON }}
permissions:
  contents: read
jobs:
  offline:
    uses: ./.github/workflows/infrastructure.yml
  target:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      profile: ${{ steps.target.outputs.profile }}
      profile_sha256: ${{ steps.target.outputs.profile_sha256 }}
      environment: ${{ steps.target.outputs.environment }}
      account: ${{ steps.target.outputs.account }}
      region: ${{ steps.target.outputs.region }}
      role: ${{ steps.target.outputs.maintenance_role }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: target
        env:
          DEPLOYMENT_TARGET: ${{ inputs.target }}
        run: python3 backend/infrastructure/deployment_profile.py
  maintenance:
    needs: [offline, target]
    if: github.ref == 'refs/heads/main' && vars.AWS_MAINTENANCE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ needs.target.outputs.environment }}
    concurrency:
      group: fitfinity-${{ needs.target.outputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fetch exact reviewed evidence before AWS authentication
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_PROFILE: ${{ needs.target.outputs.profile }}
          MAINTENANCE_MODE: ${{ inputs.mode }}
          REVIEW_RUN: ${{ inputs.review_run }}
          REVIEW_SHA256: ${{ inputs.review_sha256 }}
          PRIOR_RUN: ${{ inputs.prior_run }}
        run: python3 backend/infrastructure/maintenance_operator.py fetch --profile "$DEPLOYMENT_PROFILE"
      - name: Require dedicated maintenance role
        env:
          MAINTENANCE_ROLE: ${{ vars.AWS_MAINTENANCE_ROLE_ARN }}
          EXPECTED_ROLE: ${{ needs.target.outputs.role }}
        run: test "$MAINTENANCE_ROLE" = "$EXPECTED_ROLE"
      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ vars.AWS_MAINTENANCE_ROLE_ARN }}
          role-session-name: fitfinity-maintenance-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: ${{ needs.target.outputs.region }}
          allowed-account-ids: ${{ needs.target.outputs.account }}
          unset-current-credentials: true
      - name: Execute one reviewed maintenance step
        env:
          DEPLOYMENT_PROFILE: ${{ needs.target.outputs.profile }}
          MAINTENANCE_MODE: ${{ inputs.mode }}
          REVIEW_SHA256: ${{ inputs.review_sha256 }}
        run: python3 backend/infrastructure/maintenance_operator.py execute --profile "$DEPLOYMENT_PROFILE"
      - name: Retain operational receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fitfinity-maintenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/maintenance-receipt.json
          if-no-files-found: warn
          retention-days: 7
