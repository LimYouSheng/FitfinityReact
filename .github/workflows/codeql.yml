name: CI - CodeQL Security Analysis
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 1 * * 1' # Monday 09:00 Singapore
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - name: Explain Workflow Purpose And Expected Results
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'FITFINITY_WORKFLOW_GUIDE'
          ## CI - CodeQL Security Analysis

          **What It Does:** PR/main, weekly Monday09:00 Singapore or manual; JavaScript/Python analysis.

          **When To Use It:** Continuous code security scanning.

          **What To Expect:** Expect separate JavaScript and Python analyses and retained scan reports. A successful analysis is not proof of zero alerts; review the Security tab.

          This is a workflow guide, not a success receipt. Check job results and retained artifacts.

          Full procedure: `docs/runbook.md`, section 6.
          FITFINITY_WORKFLOW_GUIDE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Analyze and publish security findings
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: /language:${{ matrix.language }}
          output: ${{ runner.temp }}/codeql-results
      - name: Retain scan evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codeql-${{ matrix.language }}-${{ github.run_id }}
          path: ${{ runner.temp }}/codeql-results
          retention-days: 7
          if-no-files-found: warn
