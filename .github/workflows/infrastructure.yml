name: CI - Infrastructure Verification

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Explain Workflow Purpose And Expected Results
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'FITFINITY_WORKFLOW_GUIDE'
          ## CI - Infrastructure Verification

          **What It Does:** Called by AWS workflows or manually; offline operator regressions.

          **When To Use It:** Infrastructure safety checks without AWS changes.

          **What To Expect:** Expect an offline infrastructure regression result and retained log. No AWS resources or live database are accessed.

          This is a workflow guide, not a success receipt. Check job results and retained artifacts.

          Full procedure: `docs/runbook.md`, section 6.
          FITFINITY_WORKFLOW_GUIDE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Install locked verification dependencies
        run: npm ci --ignore-scripts
      - name: Run canonical offline operators and regression fixtures
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:infrastructure 2>&1 | tee "$RUNNER_TEMP/fitfinity-infrastructure.log"
      - name: Preserve complete infrastructure results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fitfinity-infrastructure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fitfinity-infrastructure.log
          if-no-files-found: error
