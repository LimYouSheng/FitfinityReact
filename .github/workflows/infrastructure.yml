name: Infrastructure regression gate

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Run canonical offline operators and regression fixtures
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:infrastructure 2>&1 | tee "$RUNNER_TEMP/fitfinity-infrastructure.log"
      - name: Preserve complete infrastructure results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fitfinity-infrastructure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fitfinity-infrastructure.log
          if-no-files-found: error
