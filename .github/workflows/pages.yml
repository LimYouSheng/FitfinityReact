name: CI - Verify And Publish Staff Demo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: fitfinity-pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  build:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    env:
      VITE_PORTAL_MODE: 'demo'
      VITE_API_BASE_URL: ''
    steps:
      - name: Explain Workflow Purpose And Expected Results
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'FITFINITY_WORKFLOW_GUIDE'
          ## CI - Verify And Publish Staff Demo

          **What It Does:** PR/main/manual; runs application verification, then publishes the demo on main.

          **When To Use It:** Routine source validation and demo publishing; not the AWS site.

          **What To Expect:** Expect verification checks, followed on main by the Pages build and demo URL. PR runs intentionally skip publishing. This does not deploy the AWS application.

          This is a workflow guide, not a success receipt. Check job results and retained artifacts.

          Full procedure: `docs/deployment/workflows/index.md`, section 6.
          FITFINITY_WORKFLOW_GUIDE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Read Pages location
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Build the verified source for Pages
        env:
          FITFINITY_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: |
          npm run build
          npm run verify:pwa -- dist "$FITFINITY_BASE_PATH"
      - name: Upload verified site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish staff demo
        id: publish
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
