name: Verify and publish the staff demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fitfinity-pages
  cancel-in-progress: false

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    env:
      CI: 'true'
      FORCE_COLOR: '1'
      PLAYWRIGHT_FORCE_TTY: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Unit gate
        shell: bash
        run: |
          set -euo pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/fitfinity-unit.log"
          node scripts/verify-test-results.mjs unit "$RUNNER_TEMP/fitfinity-unit.log"
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Browser gate at root and repository paths
        shell: bash
        run: |
          set -euo pipefail
          npm run test:e2e -- --reporter=list 2>&1 | tee "$RUNNER_TEMP/fitfinity-browser.log"
          node scripts/verify-test-results.mjs browser "$RUNNER_TEMP/fitfinity-browser.log"
      - name: Read Pages location
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Build the verified source for Pages
        env:
          FITFINITY_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: |
          npm run build
          npm run verify:pwa -- dist "$FITFINITY_BASE_PATH"
      - name: Upload verified site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    needs: verify-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish staff demo
        id: publish
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
